<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Age Calculator - Fast & Accurate</title>
    <meta name="description" content="Calculate your exact age in years, months, and days instantly. Modern, simple, and 100% free online tool.">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .icon-header {
            font-size: 50px;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="date"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input[type="date"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }
        button:active {
            transform: scale(0.98);
        }
        .result-box {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .card {
            background: #0f172a;
            padding: 15px 5px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .card .num {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }
        .card .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-header">
        <i class="fa-solid fa-cake-candles"></i>
    </div>
    <h2>Age Calculator</h2>
    <p class="subtitle">Select your birth date to find your exact age</p>

    <div class="input-group">
        <label for="dob">DATE OF BIRTH</label>
        <input type="date" id="dob">
    </div>

    <button onclick="calculateAge()">Calculate Age</button>

    <div class="result-box" id="resultBox">
        <div class="results-grid">
            <div class="card">
                <div class="num" id="years">0</div>
                <div class="label">Years</div>
            </div>
            <div class="card">
                <div class="num" id="months">0</div>
                <div class="label">Months</div>
            </div>
            <div class="card">
                <div class="num" id="days">0</div>
                <div class="label">Days</div>
            </div>
        </div>
    </div>
</div>

<script>
    function calculateAge() {
        let dobInput = document.getElementById('dob').value;
        if (!dobInput) {
            alert('Please select your Date of Birth!');
            return;
        }

        let dob = new Date(dobInput);
        let today = new Date();

        let years = today.getFullYear() - dob.getFullYear();
        let months = today.getMonth() - dob.getMonth();
        let days = today.getDate() - dob.getDate();

        if (days < 0) {
            months--;
            days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        document.getElementById('years').innerText = years;
        document.getElementById('months').innerText = months;
        document.getElementById('days').innerText = days;

        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
